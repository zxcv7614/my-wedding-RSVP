<!-- =========================
     RSVP
========================== -->

<section class="section rsvp-link-section">

    <p class="section-label">
        RSVP
    </p>

    <div class="section-line"></div>

    <h2>
        함께해 주실 수 있나요?
    </h2>

    <p class="rsvp-link-message">
        참석 여부를 알려주시면<br>
        소중히 준비하겠습니다.
    </p>


    <details class="rsvp-details">

        <summary class="rsvp-button">
            <span class="rsvp-open-text">
                RSVP 작성하기
            </span>

            <span class="rsvp-close-text">
                RSVP 닫기
            </span>
        </summary>


        <div class="rsvp-form-wrapper">

            <form id="rsvpForm">


                <!-- 참석 여부 -->

                <div class="rsvp-field">

                    <p class="rsvp-question">
                        참석 여부
                    </p>

                    <div class="attendance-options">

                        <label class="attendance-option">

                            <input
                                type="radio"
                                name="attendance"
                                value="attending"
                                required
                            >

                            <span>
                                참석합니다
                            </span>

                        </label>


                        <label class="attendance-option">

                            <input
                                type="radio"
                                name="attendance"
                                value="unable"
                                required
                            >

                            <span>
                                참석이 어렵습니다
                            </span>

                        </label>

                    </div>

                </div>


                <!-- 이름 -->

                <div class="rsvp-field">

                    <label for="guestName">
                        성함
                    </label>

                    <input
                        type="text"
                        id="guestName"
                        name="guestName"
                        placeholder="성함을 입력해 주세요"
                        required
                    >

                </div>


                <!-- 연락처 -->

                <div class="rsvp-field">

                    <label for="phone">
                        연락처
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="연락처를 입력해 주세요"
                        required
                    >

                </div>


                <!-- 참석 인원 -->

                <div class="rsvp-field">

                    <label for="guestCount">
                        참석 인원
                    </label>

                    <select
                        id="guestCount"
                        name="guestCount"
                    >

                        <option value="">
                            선택해 주세요
                        </option>

                        <option value="1">
                            1명
                        </option>

                        <option value="2">
                            2명
                        </option>

                        <option value="3">
                            3명
                        </option>

                        <option value="4">
                            4명
                        </option>

                        <option value="5+">
                            5명 이상
                        </option>

                    </select>

                </div>


                <!-- 메시지 -->

                <div class="rsvp-field">

                    <label for="message">
                        전하고 싶은 말씀
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="4"
                        placeholder="축하 메시지를 남겨주세요"
                    ></textarea>

                </div>


                <!-- 제출 -->

                <button
                    type="submit"
                    class="submit-rsvp"
                >
                    Submit RSVP
                </button>


                <p
                    id="rsvpResult"
                    class="rsvp-result"
                ></p>

            </form>

        </div>

    </details>

</section>
